# GitHub Actions — magic-agent 跨平台构建 + 发布到 npmjs.org
#
# 触发：
#   - push tag v*.*.*       （正式发布；版本号取 tag 名）
#   - workflow_dispatch    （手动跑，默认 dry-run 模式：发布 0.0.0-rc.<run_id>，npm 不会拒覆盖但也不会污染主版本）
#
# 链路（与 magic-stock 同款思路，但 magic-agent 只有一个 npm 包）：
#   1) build job（5 平台矩阵: ubuntu-22.04(linux-x64 / linux-arm64) + macos-15 / macos-15-intel + windows-2022）：
#        - setup-go 走 go.mod
#        - npm ci（拉前端 npm wrapper 依赖）
#        - npm run build -- --target=<label>（→ npm/build.js 交叉编译，prepack 默认走全量）
#        - 上传 artifact: magic-agent-<plat>
#
#   注：纯 Go + CGO_ENABLED=0，各平台的二进制由 go 交叉编译产出，不需要 QEMU；
#       「目标平台」由 --target=<label> 显式指定，不能用 --current（那会编译出 runner 自身的架构）。
#       macOS Intel 镜像 macos-13 已于 2025-12-04 下线，改用 macos-15-intel。
#   2) publish job（依赖 build，单 runner ubuntu-22.04）：
#        - 下载 5 个 artifact，把二进制合并到 npm/dist/<plat>/magic-agent[.exe]
#        - 从 tag 解析版本号，写回 package.json
#        - npm publish --access public --ignore-scripts
#
# 前置（GitHub repo secrets）：
#   - NPM_TOKEN: npm Automation token（带 publish 作用域）
#     生成：https://www.npmjs.com/settings/<your-name>/tokens → "Generate New Token" → "Automation"
#
# ⚠️ 本 workflow 不发布 GitHub Release asset，只发 npm。
#    想要 GitHub Release：在 publish job 末尾追加 softprops/action-gh-release@v2 即可。

name: release-npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # 1) 交叉编译 5 平台产物
  # ============================================================
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
            apt: ''
          - os: ubuntu-22.04
            label: linux-arm64
          - os: macos-15-intel
            label: darwin-x64
          - os: macos-15
            label: darwin-arm64
          - os: windows-2022
            label: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm ci
        run: npm ci || npm install

      - name: Build prebuilt for ${{ matrix.label }}
        run: npm run build -- --target=${{ matrix.label }}

      - name: Verify binary produced
        shell: bash
        run: |
          if [ "${{ matrix.label }}" = "win32-x64" ]; then
            ls -la npm/dist/win32-x64/magic-agent.exe
          else
            ls -la npm/dist/${{ matrix.label }}/magic-agent
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic-agent-${{ matrix.label }}
          path: npm/dist/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # 2) Publish npm 包
  # ============================================================
  publish-npm:
    name: Publish to npmjs.org
    needs: build
    runs-on: ubuntu-22.04
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # ⚠️ 必须声明 registry-url：setup-node 才会写出含
          #    //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} 的 .npmrc。
          #    只给 npm publish 传 NODE_AUTH_TOKEN 环境变量是无效的 —— 那会 ENEEDAUTH。
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm auth (fail fast)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret 未配置或为空"
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org

      - name: Resolve target version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # workflow_dispatch 默认 dry-run: 用 0.0.0-rc.<run_id>
            # npm 接受 prerelease 但不会污染主版本号
            VERSION="0.0.0-rc.${GITHUB_RUN_ID}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Sync version into package.json
        run: |
          node -e "
            const fs = require('fs');
            const p = './package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('package.json version →', j.version);
          "

      - name: Download all 5 platform artifacts
        uses: actions/download-artifact@v4
        with:
          # ⚠️ 不能开 merge-multiple：那会把 5 份 artifact 摊平到一个目录里，
          #    下面按 artifacts/magic-agent-<label>/ 定位的暂存步骤就找不到目录了。
          #    保持各自成目录，目录名 = artifact 名。
          path: artifacts/

      - name: Stage prebuilt binaries into npm/dist/
        run: |
          echo "=== downloaded artifact layout ==="
          ls -la artifacts/
          for d in artifacts/*/; do echo "--- $d"; ls -la "$d"; done
          mkdir -p npm/dist
          # 用 plat=artifact 键值对逐条走，不用 declare -A：
          # 关联数组要 bash 4+，本机 macOS 自带 bash 3.2 跑不了这段，写成可移植的更省事。
          for entry in \
            darwin-arm64=magic-agent-darwin-arm64 \
            darwin-x64=magic-agent-darwin-x64 \
            linux-x64=magic-agent-linux-x64 \
            linux-arm64=magic-agent-linux-arm64 \
            win32-x64=magic-agent-win32-x64
          do
            plat="${entry%%=*}"
            src="artifacts/${entry#*=}"
            if [ ! -d "$src" ]; then
              echo "::error::Missing artifact for $plat ($src)"
              exit 1
            fi
            dest="npm/dist/${plat}"
            mkdir -p "$dest"
            cp -r "$src"/* "$dest/"
            echo "→ staged $plat ($(du -sh $dest | cut -f1))"
          done
          echo ""
          echo "=== final npm/dist layout ==="
          ls -la npm/dist/

      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "▶ Dry-run 模式（workflow_dispatch）：npm publish --dry-run，不会真发"
            npm publish --access public --ignore-scripts --dry-run
          else
            echo "▶ 正式发布 v${{ steps.version.outputs.version }} 到 npmjs.org"
            npm publish --access public --ignore-scripts
          fi

      - name: Verify npm version (正式发布后)
        if: github.event_name == 'push'
        run: |
          # npm publish 受理后 CDN 元数据传播要几分钟（registry 自己都提示
          # "may take a few minutes"），单次校验必然读到旧版本误报红 —— 改成轮询：
          # 每 15s 查一次，最多等 6 分钟，看到目标版本即过。
          WANT="${{ steps.version.outputs.version }}"
          for i in $(seq 1 24); do
            VERSION=$(npm view magic-agent version 2>/dev/null || echo "FETCH_FAILED")
            echo "[${i}/24] npm view magic-agent version → ${VERSION}"
            if [ "${VERSION}" = "${WANT}" ]; then
              echo "✓ npmjs.org 上 magic-agent@${VERSION} 已就位"
              exit 0
            fi
            sleep 15
          done
          echo "::error::等了 6 分钟，npm 上仍是 ${VERSION}，与发布的 ${WANT} 不一致"
          exit 1