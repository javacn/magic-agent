<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>掌天瓶</title>
<!--
  移动端界面 = 按 agents-anywhere 安卓端（Jetpack Compose）的视觉规格复刻的 HTML 版。
  颜色/尺寸不是目测来的，是从它源码里抄的：

  designsystem/Theme.kt          → 全部色令牌（暗色 canvas #09090B / 亮色 #FDFCFB 等）
  SessionMessages.kt             → 对话区：气泡 / 文本 / 工具卡 / 思考块 / 状态胶囊 / 工具占位
  SessionComposer.kt             → 输入框 + 动作行 + ComposerVeil
  AgentMarkdownText.kt           → markdown 排版（标题/列表/引用/表格/代码面板/行内码）
  CodeBlockPreview.kt            → SoraCodeBlock 12dp 圆角代码块
  Components.kt                  → BackIconButton / BackPill / AuthErrorNotice

  结构对齐它的 HomeScreen 与 SessionDetailScreen。详见各段注释里的原始常量。
-->
<style>
/* ⚠️ 字体策略：拉丁（Agents Anywhere）走 Caveat，中文走 Ma Shan Zheng。
   Caveat 是仓库里现成那份（OFL），7KB woff2 直接打进 APK；
   Ma Shan Zheng 是 Google Fonts 的 OFL 字体，按 unicode-range 分片；
   页面启动时只下载「掌天瓶」三字所在分片。CDN 嵌一行 URL，不占 APK 体积。
   代价：断网时中文退回系统字体（仍是中文，但不再有手写感），不影响其他功能。 */
@font-face{font-family:Caveat;src:url(assets/caveat.woff2) format("woff2");font-display:swap;}
@font-face{font-family:'MaShanZheng';font-style:normal;font-weight:400;font-display:swap;
  src:url(https://fonts.gstatic.com/s/mashanzheng/v18/NaPecZTRCLxvwo41b4gvzkXaRMGEFoZJFdX0wQ5Xo5Hr21L9zCcRFhbSe5Nk0pIMuUkHEA.119.woff2) format("woff2");
  unicode-range:U+4E00-9FFF,U+3400-4DBF,U+2E80-2EFF,U+3000-303F,U+FF00-FFEF;}

:root{
  /* ⚠️ 默认 = 暗色：跟 anywhere 的 DarkAgentsAnywhereColors 逐字段对齐。
     用户在系统里选了亮色才切亮色（用户没设主题时不会莫名跑出白底）。 */
  color-scheme:dark;
  /* ── 基础 ── */
  --canvas:#09090B; --canvas-rgb:9,9,11;
  --ink:#FAFAFA; --ink-soft:#E5E5E5; --muted:#A3A3A3; --faint:#737373;
  --border:rgba(255,255,255,.09); --subtle:#292929; --raised:#1F1F1F; --dialog:#242424;
  --primary-action:#FAFAFA; --on-primary-action:#09090B;
  /* ── 会话专用 ── */
  --bubble:#2A2A2A; --bubble-text:#F4F4F5;
  --code:#111113; --status-neutral:#2D2D2D; --status-neutral-text:#D4D4D8;
  --activity:rgba(24,24,27,.063);
  /* ── markdown ── */
  --md-body:#EDEDEF; --md-muted:#A1A1AA; --md-border:#27272A; --md-code-bg:#292929;
  --link:#EBB353; --prompt:#E8798F; --shimmer:#FFFFFF;
  --panel:#1F1F1F; --panel-border:#27272A;
  /* ── 语义色 ── */
  --accent:#39A887; --warning:#F59E0B; --success:#22C55E;
  --error-surface:#2A1214; --error-border:#5F2429; --error-text:#FCA5A5; --error-icon:#F97066;
  --running:#10B981; --transitioning:#3B82F6; --active:#F59E0B;
  --app-shadow:rgba(0,0,0,.32);
  --r-card:18px; --r:12px; --r-full:999px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"SF Mono",monospace;
}
@media (prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --canvas:#FDFCFB; --canvas-rgb:253,252,251;
    --ink:#0A0A0B; --ink-soft:#2B2B2B; --muted:#777777; --faint:#AAA8A2;
    --border:#E7E5E0; --subtle:#F1F0ED; --raised:#FFFFFF; --dialog:#FFFFFF;
    --primary-action:#0A0A0B; --on-primary-action:#FFFFFF;
    --bubble:#F1F0ED; --bubble-text:#242522;
    --code:rgba(255,255,255,.72); --status-neutral:#E4E2DD; --status-neutral-text:#6F6E69;
    --activity:rgba(241,240,237,.08);
    --md-body:#242522; --md-muted:#7C7B76; --md-border:#E4E1DB; --md-code-bg:#F1F0ED;
    --link:#EBB353; --prompt:#C45D74; --shimmer:#000000;
    --panel:#ECECEA; --panel-border:transparent;
    --accent:#18866A; --warning:#D97706; --success:#16A34A;
    --error-surface:#FFF4F4; --error-border:#F4C7C7; --error-text:#B42318; --error-icon:#B42318;
    --app-shadow:rgba(0,0,0,.13);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ⚠️ 这里必须是「锁死视口高度」而不是 min-height：
   用 min-height 时 .app 会被内容撑高，滚动条落到 document 上，
   .thread 的 overflow-y:auto 永远不触发 —— 后果是打开会话时看不到顶部，
   也做不了「回到底部」。 */
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--canvas);color:var(--ink);font:15px/1.45 var(--font);overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block}

.app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column}
.view{flex:1;display:none;flex-direction:column;min-height:0}
.view--on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:110px}

/* ── 顶栏：头像 / 手写体字标 / 搜索 ── */
.topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px;
        padding:calc(env(safe-area-inset-top) + 10px) 16px 6px}
.iconbtn{width:40px;height:40px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;
         background:var(--raised);color:var(--ink);border:1px solid var(--border)}
.iconbtn--plain{background:none;border:0;color:var(--muted)}
.wordmark{text-align:center;font-family:Caveat,"MaShanZheng","PingFang SC",var(--font);font-size:30px;line-height:1.1;
          font-weight:600;letter-spacing:.3px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 三个快捷入口 ── */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px 4px}
.qcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;min-height:92px;
       background:var(--raised);border:1px solid var(--border);border-radius:var(--r-card)}
.qcard__icon{color:var(--muted);margin-bottom:14px}
.qcard__t{font-size:15px;font-weight:600;color:var(--ink)}
.qcard__s{font-size:12px;color:var(--muted)}

/* ── 分段控件 ── */
.seg{display:flex;gap:4px;padding:10px 16px 4px}
.seg button{height:34px;padding:0 16px;border-radius:var(--r-full);font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--subtle);color:var(--ink);border:1px solid var(--border)}

/* ── 分组标题（可折叠）── */
.section{display:flex;align-items:center;gap:6px;width:100%;padding:16px 16px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.section svg{color:var(--faint);transition:transform .18s}
.section[aria-expanded="false"] svg{transform:rotate(-90deg)}

/* ── 会话行 ── */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px 6px 16px;text-align:left}
.row:active{background:var(--subtle)}
.row__grip{color:var(--faint);flex:0 0 auto}
.row__main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row__t{font-size:15px;font-weight:500;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__meta{flex:0 0 auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row__more{flex:0 0 auto;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:var(--r-full);flex:0 0 auto;background:var(--faint)}
.dot--run{background:var(--running)}
.dot--active{background:var(--active)}
.empty{padding:22px 16px;color:var(--muted);font-size:14px}

/* ── FAB ── */
.fab{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom) + 28px);width:56px;height:56px;
     border-radius:var(--r-full);background:var(--primary-action);color:var(--on-primary-action);
     display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px -8px var(--app-shadow);z-index:20}
.fab:active{transform:scale(.94)}

/* ══════════ 会话详情 ══════════ */
.detailbar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;
           padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;flex:0 0 auto}
/* BackIconButton：40dp 圆 · raisedSurface · 1dp border · ChevronLeft 22dp */
.titlepill{justify-self:center;max-width:100%;height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;
           border:1px solid var(--border);border-radius:var(--r-full);background:var(--raised);
           font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* MessageList LazyColumn：padding horizontal 20dp · spacedBy 16dp
   首项留 74dp，底部留 168dp（bottomContentPadding） */
.thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
        display:flex;flex-direction:column;gap:16px;padding:74px 20px 168px}
/* 单个 timeline item 内：spacedBy(7.dp) */
.tgroup{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}

/* ── 用户气泡 UserBubble ──
   SessionMessages.kt:1341  RoundedCornerShape(22.dp) · sessionMessageBubble
   :1343 padding(horizontal=17, vertical=13) · :1349 16.5sp / 24sp · maxLines 8
   :1296 maxBubbleWidth = maxWidth * 0.78f
   左侧 30dp 圆形复制按钮，底部 padding 3dp（:1335），图标 17dp（:1425） */
.urow{display:flex;justify-content:flex-end;align-items:flex-end;gap:6px;max-width:100%}
.urow__col{display:flex;flex-direction:column;align-items:flex-end;gap:7px;min-width:0;max-width:78%}
.ubub{position:relative;max-width:100%;border-radius:22px;background:var(--bubble);
      padding:13px 17px;display:flex;flex-direction:column;gap:7px}
.ubub__t{color:var(--bubble-text);font-size:16.5px;line-height:24px;font-weight:400;
         white-space:pre-wrap;word-break:break-word;overflow:hidden}
/* 折叠 = 8 行 + 省略号（:1352 maxLines = 8 · TextOverflow.Ellipsis） */
.ubub:not(.is-open) .ubub__t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;overflow:hidden}
.ubub__more{align-self:flex-start;color:var(--warning);font-size:12px;font-weight:700;line-height:1.2}
.ubub__meta{align-self:flex-end;font-size:11px;font-weight:600;color:var(--error-icon)}
/* MessageCopyButton：30dp 圆 · muted · 17dp 图标（:1406-1426） */
.copybtn{width:30px;height:30px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;
         color:var(--muted);flex:0 0 auto}
.copybtn:active{background:var(--activity)}
.copybtn--sm{width:23px;height:23px}

/* ── Agent 文本 AgentMarkdownText ──
   AgentMarkdownText.kt:139-143  padding horizontal 4dp · spacedBy 8dp */
.md{padding:0 4px;display:flex;flex-direction:column;gap:8px;
    color:var(--md-body);font-size:17px;line-height:27px;font-weight:400;word-break:break-word}
.md>*{margin:0}
.md h1{font-size:22px;line-height:30px;font-weight:700}
.md h2{font-size:20px;line-height:28px;font-weight:700}
.md h3,.md h4,.md h5,.md h6{font-size:18px;line-height:26px;font-weight:700}
.md strong{font-weight:700}
.md em{font-style:italic}
.md del{text-decoration:line-through}
.md a{color:var(--link);text-decoration:underline;word-break:break-all}
.md hr{border:0;height:1px;background:var(--md-border)}
/* MarkdownList(:219-250)  16sp/24sp 的 marker + 8dp 间距 + 6dp 条目间距 */
.md ul,.md ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.md li{display:flex;gap:8px}
.md li>.mk{flex:0 0 auto;color:var(--md-muted);font-size:16px;line-height:24px}
.md li>.mk--mono{font-family:var(--mono);font-size:14px;line-height:24px}
.md li>.li-b{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
/* MarkdownQuote(:254-278)  2dp 竖线 + 10dp 间距 + 文字转 muted */
.md blockquote{display:flex;gap:10px;align-items:stretch}
.md blockquote>.bar{flex:0 0 auto;width:2px;background:var(--md-border);border-radius:1px}
.md blockquote>.q-b{flex:1;min-width:0;color:var(--md-muted)}
/* MarkdownTable(:281-320)  8dp 圆角 · 1dp 描边 · 表头底色 codeBackground · 单元 10/8dp
   表格本身按内容宽度收缩（与 Compose 的 horizontalScroll 一致），超宽才横向滚动 */
.md-table-wrap{align-self:flex-start;max-width:100%;overflow-x:auto;border:1px solid var(--md-border);border-radius:8px}
.md table{border-collapse:collapse;font-size:14.5px;line-height:22px}
.md th,.md td{min-width:112px;max-width:240px;padding:8px 10px;border:.5px solid var(--md-border);text-align:left;vertical-align:top}
.md th{background:var(--md-code-bg);font-weight:700}
/* 行内码 codeInlineContent(:445-480)  5dp 圆角 · 14sp mono · 7/2dp 内边距 */
.md code{font-family:var(--mono);font-size:14px;line-height:20px;background:var(--md-code-bg);
         border:1px solid var(--md-border);border-radius:5px;padding:1px 6px;word-break:break-all}
.md .md-code--file{color:var(--link);text-decoration:underline}
/* 段落内单行码过长时（:508 length>30 或含空白）整块换行显示 */
.md .md-code--wrap{display:inline-block;padding:3px 7px}

/* ── 代码面板 MarkdownCodePanel(:602-670) ──
   20dp 圆角 · shadow 20dp · raisedSurface(暗)/#ECECEA(亮) · 暗色 1dp #27272A 描边
   padding(18,17,18,12) · label 14sp/18sp Bold · 复制按钮 23dp · 间隔 14dp */
.codepanel{background:var(--panel);border:1px solid var(--panel-border);border-radius:20px;
           box-shadow:0 12px 28px -8px var(--app-shadow);padding:17px 18px 12px;display:flex;flex-direction:column}
.codepanel__head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.codepanel__label{color:var(--ink);font-size:14px;line-height:18px;font-weight:700}
.codepanel__code{margin-top:14px;overflow-x:auto}
.codepanel__pre{margin:0;font:16px/22px var(--mono);color:var(--ink);white-space:pre;letter-spacing:0}
/* BashCommandLine(:739-770)  首个 token 用 prompt 色，其余正文色 · 16sp/22sp mono Medium */
.cmdline{display:flex;gap:7px;align-items:baseline;font:500 16px/22px var(--mono);white-space:nowrap}
.cmdline+.cmdline{margin-top:4px}
.cmdline__p{color:var(--prompt)}
.cmdline__r{color:var(--ink)}

/* ── 命令行 CommandLineBar(:970-2019) ──
   11sp Bold muted 标签 + 复制按钮；命令条 14dp 圆角 · sessionCodeSurface · 1dp 描边
   padding(10,9) · "$" 13sp/18sp mono ExtraBold muted · 命令 13sp/18sp mono SemiBold inkSoft · maxLines 3 */
.cmdbar{display:flex;flex-direction:column;gap:6px}
.cmdbar__head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cmdbar__label{color:var(--muted);font-size:11px;font-weight:700}
.cmdbar__body{display:flex;gap:8px;align-items:flex-start;border-radius:14px;background:var(--code);
              border:1px solid var(--border);padding:9px 10px}
.cmdbar__p{flex:0 0 auto;color:var(--muted);font:800 13px/18px var(--mono)}
.cmdbar__t{flex:1;min-width:0;color:var(--ink-soft);font:600 13px/18px var(--mono);letter-spacing:0;
           overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-all}

/* ── 段落预览 CommandPreviewSection(:2021-2052) ──
   11sp Bold muted 标签 + 复制按钮 + SoraCodeBlock（12dp 圆角 · 1dp 描边 · min 64dp） */
.sect{display:flex;flex-direction:column;gap:6px}
.sect__head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sect__label{color:var(--muted);font-size:11px;font-weight:700}
.sect__code{border-radius:12px;border:1px solid var(--md-border);background:var(--code);
            padding:10px 12px;overflow:auto;max-height:360px}
.sect__pre{margin:0;font:13px/18px var(--mono);color:var(--md-body);white-space:pre-wrap;word-break:break-word}
.sect__pre--err{color:var(--error-text)}

/* ── 思考块 ReasoningSection(:1530-1608) ──
   行 min 34dp · padding(6,6) · 间距 8dp · chevron 16dp + Sparkles 16dp
   标题 13sp mono Normal ink · 展开体左侧缩进 30dp、右侧 6dp、markdown compact */
.rsn{display:flex;flex-direction:column;gap:8px;padding:0 4px}
.rsn__head{display:flex;align-items:center;gap:8px;min-height:34px;padding:6px;border-radius:8px}
.rsn__title{flex:1;min-width:0;color:var(--ink);font:400 13px/1.3 var(--mono);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsn__body{padding:0 6px 0 30px}
/* :806-825 markdownStyles(compact=true)：只改字号/行高/字重，颜色沿用正文色
   （间距按 AgentMarkdownText 的 spacedBy(if compact 6.dp else 8.dp) 收窄） */
.rsn__body .md{font-size:14px;line-height:21px;font-weight:300;gap:6px}
.rsn__body .md h1{font-size:17px;line-height:24px;font-weight:600}
.rsn__body .md h2{font-size:16px;line-height:23px;font-weight:600}
.rsn__body .md h3,.rsn__body .md h4,.rsn__body .md h5,.rsn__body .md h6{font-size:15px;line-height:22px;font-weight:600}
.rsn__body .md table{font-size:13px;line-height:19px}

/* ── 工具卡 ToolActivityCard(:1625-1748) ──
   折叠行 min 34dp · 8dp 圆角 · sessionTimelineActivitySurface · padding(6,6) · 间距 8dp
   chevron 16dp 收缩态 -90° · 图标 16dp muted · 文本 13sp mono Normal · maxLines 1
   展开体 14dp 圆角 · subtle 底 · 1dp 描边；Command 用 padding(16,10,16,14)，其余 16dp */
.tool{display:flex;flex-direction:column;gap:8px;padding:0 4px}
.tool__head{display:flex;align-items:center;gap:8px;min-height:34px;padding:6px;border-radius:8px;
            background:var(--activity);text-align:left;width:100%}
.tool__ico{flex:0 0 auto;color:var(--muted);display:flex}
.tool--err .tool__ico{color:var(--error-icon)}
.tool__sum{flex:1;min-width:0;color:var(--ink);font:400 13px/1.3 var(--mono);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool--err .tool__sum{color:var(--error-icon)}
.tool__detail{border-radius:14px;background:var(--subtle);border:1px solid var(--border);
              padding:16px;display:flex;flex-direction:column;gap:12px}
.tool--cmd .tool__detail{padding:10px 16px 14px}
/* TimelineChevron(:2095-2110) 展开 0° / 折叠 -90°，200ms */
.chev{flex:0 0 auto;color:var(--muted);display:flex;transition:transform .2s ease}
.tool__head[aria-expanded="false"] .chev,.rsn__head[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.ico{flex:0 0 auto;color:var(--muted);display:flex}
/* TimelineShimmerText(:2140-2197) 运行中做 1.4s 线性扫光 */
@keyframes shimmerSweep{from{background-position:180% 0}to{background-position:-80% 0}}
.shimmer{background:linear-gradient(90deg,currentColor 0%,currentColor 34%,var(--shimmer) 50%,currentColor 66%,currentColor 100%);
         background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
         animation:shimmerSweep 1.4s linear infinite}

/* ── 状态胶囊 CompactStatusPill(:2112-2138) ──
   高 20dp · 最小宽 40dp · 全圆 · sessionStatusNeutralSurface · padding horizontal 8dp
   文字 11sp Bold · sessionStatusNeutralText */
.pill{height:20px;min-width:40px;border-radius:var(--r-full);background:var(--status-neutral);
      color:var(--status-neutral-text);font-size:11px;line-height:11px;font-weight:700;
      display:inline-flex;align-items:center;justify-content:center;padding:0 8px;flex:0 0 auto}
.pill--err{background:var(--error-surface);color:var(--error-text)}

/* ── 工具占位 ToolPlaceholder(:2199-2270) ──
   padding horizontal 4dp · 间距 8dp · 图标 16dp · 文本 13sp Bold muted */
.ph{display:flex;flex-direction:column;gap:8px;padding:0 4px}
.ph__row{display:flex;align-items:center;gap:8px;min-height:34px;padding:6px;border-radius:8px}
.ph__ico{flex:0 0 auto;color:var(--muted);display:flex}
.ph__t{color:var(--muted);font-size:13px;font-weight:700;flex:0 1 auto;min-width:0;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph--err .ph__ico{color:var(--error-icon)}
.ph--err .ph__t{color:var(--error-icon)}

/* ── 运行中指示 WorkingIndicator(:1072-1120) ──
   16dp 转圈 + 13sp Bold muted，间距 8dp，padding horizontal 4dp */
.working{display:flex;align-items:center;gap:8px;padding:0 4px}
.working__sp{width:16px;height:16px;flex:0 0 auto;border-radius:50%;
             background:conic-gradient(from -90deg,var(--muted) 0deg 100deg,color-mix(in srgb,var(--muted) 24%,transparent) 100deg 360deg);
             -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
             mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
             animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.working__t{color:var(--muted);font-size:13px;font-weight:700}

/* ── 会话压缩分隔 CompactTimelineSeparator(:2272-2315) ── */
.sep{display:flex;align-items:center;gap:12px;padding:8px 4px}
.sep__line{flex:1;height:1px;background:var(--faint);opacity:.38}
.sep__t{color:var(--muted);font-size:13px;flex:0 0 auto}

/* ── 回复动作 AgentReplyActions(:554-587) ──
   padding(4,4,top 3) · 间距 5dp · 1dp 半透明分割线 · 复制/分享各 30dp 圆 */
.acts{display:flex;flex-direction:column;gap:5px;padding:3px 4px 0}
.acts__line{height:1px;background:var(--border);opacity:.5}
.acts__row{display:flex;gap:4px}

/* ── 文件附件卡 UserFileAttachmentCard(:1477-1527) ──
   224×72dp · 18dp 圆角 · sessionMessageBubble 底 · padding 10dp · 间距 10dp
   42dp 方块 14dp 圆角 raisedSurface@86% · 图标 22dp · 文件名 13sp SemiBold · 大小 11sp muted */
.fatt{width:224px;height:72px;border-radius:18px;background:var(--bubble);padding:10px;
      display:flex;align-items:center;gap:10px;text-align:left}
.fatt__ico{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--raised) 86%,transparent);
           display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--bubble-text)}
.fatt__col{flex:1;min-width:0;display:flex;flex-direction:column}
.fatt__n{color:var(--bubble-text);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fatt__s{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 错误/提示卡 AuthErrorNotice(Components.kt:88-117) ──
   14dp 圆角 · errorSurface · 1.2dp errorBorder · padding 14dp · 图标 20dp · 文字 13.5sp/17sp Medium */
.notice{display:flex;align-items:center;gap:10px;border-radius:14px;background:var(--error-surface);
        border:1.2px solid var(--error-border);padding:14px}
.notice__ico{flex:0 0 auto;color:var(--error-icon);display:flex}
.notice__t{flex:1;min-width:0;color:var(--error-text);font-size:13.5px;line-height:17px;font-weight:500}

/* ── 回到底部 ScrollToBottomButton(:1122-1146)
   48dp 圆 · shadow 10dp · raisedSurface · 1dp 描边 · ArrowDown 16dp
   ⚠️ 必须给 bottom：漏了它按钮会掉到容器顶部去（absolute 默认按静态位置） ── */
.tobottom{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:48px;height:48px;border-radius:var(--r-full);
          background:var(--raised);border:1px solid var(--border);color:var(--ink);
          display:none;align-items:center;justify-content:center;
          box-shadow:0 10px 20px -6px var(--app-shadow);z-index:15}
.tobottom--on{display:flex}

/* ══════════ 输入区 MessageComposer ══════════
   外层 padding(14,14,bottom 24)（SessionComposer.kt:136-138）
   ComposerVeil(:66-85)：184dp 高，0f→透明 / .48f→72% / 1f→96% 的 canvas 渐变
   输入框：heightIn 104~218dp · shadow 28dp · RoundedCornerShape(22.dp) · 1dp 描边
           · padding(16,16,16,12) · 间距 10dp
   BasicTextField：16sp / 21sp Medium · maxLines 4（:161-177）
   ComposerActions：行高 34dp（:525-531）· "+" 30dp（:505-513）· 接管 28dp 胶囊+30×18 开关（:514-523, 685-708）
            · 主操作 34dp 圆（:561-575） */
.composer{position:relative;flex:0 0 auto;padding:0 14px calc(env(safe-area-inset-bottom) + 24px)}
.veil{position:absolute;left:0;right:0;bottom:0;height:184px;pointer-events:none;
      background:linear-gradient(to bottom,
        rgba(var(--canvas-rgb),0) 0%,
        rgba(var(--canvas-rgb),.72) 48%,
        rgba(var(--canvas-rgb),.96) 100%)}
.composer__box{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;
               min-height:104px;max-height:218px;border-radius:22px;background:var(--raised);
               border:1px solid var(--border);box-shadow:0 16px 28px -10px rgba(0,0,0,.07);
               padding:16px 16px 12px}
.composer textarea{width:100%;min-height:28px;max-height:92px;border:0;outline:0;background:none;resize:none;
                   font-size:16px;line-height:21px;font-weight:500;padding:0;overflow-y:auto}
.composer textarea::placeholder{color:var(--muted);font-weight:500}
.composer__actions{display:flex;align-items:center;justify-content:space-between;height:34px;gap:9px}
.composer__left{display:flex;align-items:center;gap:9px;min-width:0}
.plusbtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto}
.takeover{display:flex;align-items:center;gap:5px;height:28px;flex:0 0 auto}
.switch{width:30px;height:18px;border-radius:var(--r-full);background:#303033;padding:3px;
        display:flex;align-items:center;justify-content:flex-start;transition:background .18s}
.switch i{width:12px;height:12px;border-radius:var(--r-full);background:#FAFAFA;display:block;transition:transform .18s}
.takeover.is-on .switch{background:#52525B}
.takeover.is-on .switch i{transform:translateX(12px)}
.takeover__t{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.takeover.is-on .takeover__t{color:var(--ink-soft)}
.sendbtn{width:34px;height:34px;border-radius:var(--r-full);background:var(--primary-action);
         color:var(--on-primary-action);display:flex;align-items:center;justify-content:center;flex:0 0 auto;
         transition:background .15s,color .15s}
.sendbtn:disabled{background:#3F3F46;color:#71717A}
.sendbtn--stop{background:#EF4444;color:#fff}
@media (prefers-color-scheme:light){
  .switch{background:#D8D6D1}
  .switch i{background:#FDFCFB}
  .takeover.is-on .switch{background:#2F302D}
  .takeover.is-on .switch i{background:#fff}
  .sendbtn:disabled{background:#E2E0DC;color:#A7A5A0}
}

/* ── 底部面板 ── */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40}
.backdrop--on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--dialog);
       border-radius:22px 22px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom) + 12px);
       transform:translateY(105%);transition:transform .22s cubic-bezier(.22,1,.36,1)}
.sheet--on{transform:translateY(0)}
.sheet__grip{width:38px;height:4px;border-radius:2px;background:var(--subtle);margin:6px auto 8px}
.sheet__t{padding:6px 20px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.sheet__row{display:flex;align-items:center;gap:10px;width:100%;padding:13px 20px;text-align:left;font-size:15px}
.sheet__row:active{background:var(--subtle)}
.sheet__row small{margin-left:auto;color:var(--muted);font-size:12px}
.kv{display:flex;gap:10px;padding:9px 20px;font-size:13px}
.kv b{margin-left:auto;font-weight:500;color:var(--ink-soft);font-family:var(--mono);word-break:break-all;text-align:right}
</style>

<script>
(function () {
  'use strict';

  /* ── 基址与令牌：两种宿主 ──
     桌面/浏览器同源打开：?token=…；移动容器：boot.js 注入 MAGIC_BASE/MAGIC_TOKEN。 */
  function param(name) {
    var parts = String(location.search || '').replace(/^\?/, '').split('&');
    for (var i = 0; i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      if (eq > 0 && parts[i].slice(0, eq) === name) return decodeURIComponent(parts[i].slice(eq + 1));
    }
    return '';
  }
  function stored() {
    try { return JSON.parse(sessionStorage.getItem('magic.pair') || localStorage.getItem('magic.pair') || 'null'); }
    catch (e) { return null; }
  }
  var pair = stored();
  var BASE = String(window.MAGIC_BASE || (pair && pair.base) || location.origin).replace(/\/+$/, '');
  var TOKEN = window.MAGIC_TOKEN || (pair && pair.token) || param('token') || '';

  function api(path, opts) {
    opts = opts || {};
    var headers = { 'X-Magic-Token': TOKEN };
    if (opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];
    opts.headers = headers;
    if (opts.json !== undefined) {
      opts.method = opts.method || 'POST';
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.json);
    }
    return fetch(BASE + path, opts);
  }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  var NS = 'http://www.w3.org/2000/svg';
  function svgIcon(id, size) {
    var s = document.createElementNS(NS, 'svg');

  /* ══════════ markdown 渲染 ══════════
     对齐 AgentMarkdownText.kt：commonmark + autolink + strikethrough + tables + task list。
     不引第三方库 —— 只覆盖 agent 回复里实际会出现的子集，够用且零依赖。 */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  // :937-942 parseFileRef —— 形如 src/app.ts:12 的路径引用
  function fileRef(t) {
    if (!t || /\s/.test(t) || t.indexOf('://') >= 0) return null;
    if (t.indexOf('/') < 0) return null;
    if (!/\.[a-zA-Z0-9]+(?::\d+(?::\d+)?)?$/.test(t)) return null;
    return t.replace(/:\d+(?::\d+)?$/, '');
  }
  var COPY_TOKEN = '\u0000';
  var HARD_BREAK = '\u0001';
  var copyBin = [];
  function copyAttr(text) {
    copyBin.push(String(text == null ? '' : text));
    return ' data-copy-idx="' + (copyBin.length - 1) + '"';
  }
  var COPY_BTN_HTML = '<button type="button" class="copybtn copybtn--sm" aria-label="复制"' + '\u0002' +
    '><svg width="15" height="15"><use href="#i-copy"/></svg></button>';

  function inlineMd(src) {
    var tokens = [];
    var s = String(src == null ? '' : src);
    // 硬换行（行尾两空格 或 反斜杠）
    s = s.replace(/\\\n/g, HARD_BREAK).replace(/ {2,}\n/g, HARD_BREAK);
    // 行内码先摘出来，避免被转义与强调规则动到
    s = s.replace(/`([^`]+)`/g, function (_, code) {
      var isFile = fileRef(code);
      tokens.push('<code class="md-code' + (isFile ? ' md-code--file' : '') +
        (code.length > 30 || /\s/.test(code) ? ' md-code--wrap' : '') + '">' + esc(code) + '</code>');
      return COPY_TOKEN + (tokens.length - 1) + COPY_TOKEN;
    });
    // markdown 链接也先摘出来
    s = s.replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, text, href) {
      tokens.push('<a href="' + esc(href) + '" target="_blank" rel="noreferrer noopener">' + esc(text) + '</a>');
      return COPY_TOKEN + (tokens.length - 1) + COPY_TOKEN;
    });
    // 图片 → 只保留 alt 文字（:428）
    s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1');
    s = esc(s);
    // 尖括号自动链接
    s = s.replace(/&lt;((?:https?:\/\/|mailto:)[^\s&]+)&gt;/g, function (_, url) {
      return '<a href="' + url + '" target="_blank" rel="noreferrer noopener">' + url + '</a>';
    });
    // 裸 URL
    s = s.replace(/(^|[\s(（])((?:https?:\/\/)[^\s<>"'）)]+)/g, function (_, pre, url) {
      var tail = '';
      while (/[.,;:!?]$/.test(url)) { tail = url.slice(-1) + tail; url = url.slice(0, -1); }
      if (!url) return pre;
      return pre + '<a href="' + url + '" target="_blank" rel="noreferrer noopener">' + url + '</a>' + tail;
    });
    s = s.replace(/\*\*([^\s*](?:[\s\S]*?[^\s*])?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^\s_](?:[\s\S]*?[^\s_])?)__/g, '<strong>$1</strong>');
    s = s.replace(/~~([^\s~](?:[\s\S]*?[^\s~])?)~~/g, '<del>$1</del>');
    s = s.replace(/(^|[^*\w])\*([^\s*](?:[^*]*?[^\s*])?)\*/g, '$1<em>$2</em>');
    s = s.replace(/(^|[^_\w])_([^\s_](?:[^_]*?[^\s_])?)_/g, '$1<em>$2</em>');
    s = s.split(HARD_BREAK).join('<br>').split('\n').join(' ');
    s = s.replace(new RegExp(COPY_TOKEN + '(\\d+)' + COPY_TOKEN, 'g'), function (_, i) { return tokens[+i]; });
    return s;
  }

  function splitCells(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
  }
  function isTableDelim(line) {
    var c = splitCells(line);
    return c.length >= 2 && c.every(function (x) { return /^:?-{1,}:?$/.test(x); });
  }
  function isTableHeader(line) {
    if (isTableDelim(line)) return false;

    return c.length >= 2 && c.some(function (x) { return x !== ''; });
  }
  function readTable(lines, i) {
    var header = splitCells(lines[i]);
    var aligns = splitCells(lines[i + 1]).map(function (x) {
      if (/^:-+:$/.test(x)) return 'center';
      if (/^-+:$/.test(x)) return 'right';
      return 'left';
    });
    i += 2;
    var body = [];
    while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') >= 0) { body.push(splitCells(lines[i])); i++; }
    var h = '<div class="md-table-wrap"><table><thead><tr>';
    header.forEach(function (c, k) {
      h += '<th style="text-align:' + (aligns[k] || 'left') + '">' + inlineMd(c) + '</th>';
    });
    h += '</tr></thead><tbody>';
    body.forEach(function (r) {
      h += '<tr>';
      for (var k = 0; k < header.length; k++) {
        h += '<td style="text-align:' + (aligns[k] || 'left') + '">' + inlineMd(r[k] || '') + '</td>';
      }
      h += '</tr>';
    });
    return { html: h + '</tbody></table></div>', next: i };
  }
  function readList(lines, i) {
    var ordered = /^\s*\d+[.)]\s+/.test(lines[i]);
    var m = lines[i].match(/^\s*(\d+)[.)]\s+/);
    var start = m ? parseInt(m[1], 10) : 1;
    var items = [], idx = 0;
    while (i < lines.length) {
      var mm = lines[i].match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)$/);
      if (!mm) break;
      var body = mm[1], task = null;
      var tm = body.match(/^\[([ xX])\]\s+(.*)$/);
      if (tm) { task = tm[1].toLowerCase() === 'x'; body = tm[2]; }
      // 续行：缩进的普通行并到上一条
      i++;
      while (i < lines.length && lines[i].trim() && /^\s{2,}/.test(lines[i]) &&
             !/^\s*(?:[-*+]|\d+[.)])\s+/.test(lines[i])) {
        body += ' ' + lines[i].trim(); i++;
      }
      items.push({ task: task, text: body, num: ordered ? start + idx : null });
      idx++;
    }
    var tag = ordered ? 'ol' : 'ul';
    var h = '<' + tag + '>';
    items.forEach(function (it) {
      // :222-227 anywhere 的 bullet 前缀就是字面量 "-"（不是圆点）；任务列表走 mono 的 [ ] / [x]
      var mk = it.task === null ? (it.num != null ? it.num + '.' : '-') : (it.task ? '[x]' : '[ ]');
      h += '<li><span class="mk' + (it.task !== null ? ' mk--mono' : '') + '">' + esc(mk) + '</span>' +
           '<span class="li-b">' + inlineMd(it.text) + '</span></li>';
    });
    return { html: h + '</' + tag + '>', next: i };
  }
  var BASH_LABELS = { bash: 1, sh: 1, shell: 1, zsh: 1, console: 1, terminal: 1 };
  function codePanelHtml(label, code) {
    var isBash = !!BASH_LABELS[String(label || '').toLowerCase()];
    var body;
    if (isBash) {
      // MarkdownCodePanel(:515-544) 走 BashCommandCard：按行拆，首个 token 上 prompt 色
      var cmds = String(code).split('\n').map(function (x) { return x.replace(/\s+$/, ''); })
        .filter(function (x) { return x.trim() !== ''; });
      if (!cmds.length) cmds = [code];
      body = cmds.map(function (c) {
        var t = c.trim(), sp = t.indexOf(' ');
        var first = sp < 0 ? t : t.slice(0, sp);
        var rest = sp < 0 ? '' : t.slice(sp + 1).replace(/^\s+/, '');
        return '<div class="cmdline"><span class="cmdline__p">' + esc(first) + '</span>' +
               (rest ? '<span class="cmdline__r">' + esc(rest) + '</span>' : '') + '</div>';
      }).join('');
    } else {
      body = '<pre class="codepanel__pre">' + esc(code) + '</pre>';
    }
    return '<div class="codepanel"><div class="codepanel__head">' +
      '<span class="codepanel__label">' + esc(isBash ? 'Bash' : (label || 'code')) + '</span>' +
      COPY_BTN_HTML.split('\u0002').join(copyAttr(code)) +
      '</div><div class="codepanel__code">' + body + '</div></div>';
  }
  function mdToHtml(src) {
    var lines = String(src == null ? '' : src).replace(/\r\n?/g, '\n').split('\n');
    // :883-911 normalizeMarkdownTables：表格前一行不是空行时补一个空行
    var norm = [], inFence = false, k;
    for (k = 0; k < lines.length; k++) {
      if (!inFence && k + 1 < lines.length && isTableHeader(lines[k]) && isTableDelim(lines[k + 1]) &&
          norm.length && norm[norm.length - 1].trim() !== '') norm.push('');
      norm.push(lines[k]);
      if (/^\s*(```|~~~)/.test(lines[k])) inFence = !inFence;
    }
    var n = norm.length, i = 0, out = [];
    while (i < n) {
      var line = norm[i];
      if (!line.trim()) { i++; continue; }
      var fence = line.match(/^\s*(```|~~~)\s*(.*)$/);
      if (fence) {
        var mark = fence[1];
        var label = (fence[2] || '').trim().split(/\s+/)[0] || 'code';
        var buf = []; i++;
        while (i < n && !new RegExp('^\\s*' + mark).test(norm[i])) { buf.push(norm[i]); i++; }
        i++;
        out.push(codePanelHtml(label, buf.join('\n')));
        continue;
      }
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out.push('<h' + h[1].length + '>' + inlineMd(h[2].trim()) + '</h' + h[1].length + '>'); i++; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
      if (/^\s*>/.test(line)) {
        var qb = [];
        while (i < n && /^\s*>/.test(norm[i])) { qb.push(norm[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote><span class="bar"></span><div class="q-b">' + mdToHtml(qb.join('\n')) + '</div></blockquote>');
        continue;
      }
      if (/^\s*(?:[-*+]|\d+[.)])\s+/.test(line)) {
        var rl = readList(norm, i); out.push(rl.html); i = rl.next; continue;
      }
      if (isTableHeader(line) && i + 1 < n && isTableDelim(norm[i + 1])) {
        var rt = readTable(norm, i); out.push(rt.html); i = rt.next; continue;
      }
      var pb = [];
      while (i < n && norm[i].trim() &&
             !/^\s*(```|~~~)/.test(norm[i]) && !/^#{1,6}\s/.test(norm[i]) &&
             !/^\s*>/.test(norm[i]) && !/^\s*(?:[-*+]|\d+[.)])\s+/.test(norm[i]) &&
             !/^\s*([-*_])(\s*\1){2,}\s*$/.test(norm[i]) &&
             !(isTableHeader(norm[i]) && i + 1 < n && isTableDelim(norm[i + 1]))) {
        pb.push(norm[i]); i++;
      }
      if (pb.length) out.push('<p>' + inlineMd(pb.join('\n')) + '</p>');
      else i++;
    }
    return out.join('');
  }

  /* UserBubble(:1286-1394)  22dp 圆角 · 17/13dp 内边距 · 16.5sp/24sp · 最多 8 行 */
  function userBubble(text, failed) {
    var wrap = tgroup();
    var row = el('div', 'urow');
    row.appendChild(copyBtn(text));                 // :1332 左侧 30dp 圆复制按钮
    var col = el('div', 'urow__col');

    bub.appendChild(t);
    col.appendChild(bub);

    row.appendChild(col);
    wrap.appendChild(row);
    pushItem(wrap, true);
    // :1352-1356 maxLines = 8，溢出时给「展开 / 收起」
    var w = t.clientWidth;
    if (w > 0) {
      var probe = el('div', 'ubub__t');
      probe.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;' +
                            'display:block;max-height:none;overflow:visible;width:' + w + 'px';
      probe.textContent = text;
      document.body.appendChild(probe);
      var full = probe.scrollHeight;
      document.body.removeChild(probe);
      if (full > 8 * 24 + 2) {
        var btn = el('button', 'ubub__more', '展开');
        btn.type = 'button';
        btn.onclick = function () { btn.textContent = bub.classList.toggle('is-open') ? '收起' : '展开'; };
        bub.appendChild(btn);

  }

  function ensureRsn() {
    if (state.rsn) return state.rsn;
    var d = el('div', 'rsn');
    var head = el('button', 'rsn__head');
    head.type = 'button';
    head.setAttribute('aria-expanded', 'false');
    var chev = box('chev', 'i-chev', 16);
    head.appendChild(chev);
    head.appendChild(box('ico', 'i-spark', 16));
    var title = el('span', 'rsn__title', '思考');
    head.appendChild(title);
    var body = el('div', 'rsn__body');
    var md = el('div', 'md');
    body.appendChild(md);
    body.style.display = 'none';
    head.onclick = function () {
      // :1572 只有可展开时才挂点击；单段短摘要那种（plain）是纯展示，点不动
      if (head.getAttribute('data-plain') === '1') return;
      var open = head.getAttribute('aria-expanded') !== 'true';
      head.setAttribute('aria-expanded', String(open));
      body.style.display = open ? '' : 'none';
    };
    d.appendChild(head); d.appendChild(body);
    pushItem(d);
    state.rsn = { el: d, head: head, chev: chev, title: title, body: body, md: md, plain: false };
    state.rsnRaw = '';
    return state.rsn;
  }
  function plainSummary(s) {
    return String(s || '')
      .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/[*_~#>]+/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function updateRsnTitle() {
    var m = state.rsn;
    if (!m) return;
    var segs = String(state.rsnRaw).split(/\n{2,}/).filter(function (x) { return x.trim(); });
    var one = segs.length === 1 ? plainSummary(segs[0]) : null;
    if (one && one.length <= 80) {
      // :1539-1545 单段且能压成一行 → 直接内联成摘要，不给折叠
      m.title.textContent = '思考：' + one;
      m.plain = true;
      m.chev.style.display = 'none';
      m.head.setAttribute('data-plain', '1');
      m.head.setAttribute('aria-expanded', 'false');
      m.body.style.display = 'none';
    } else {
      m.title.textContent = segs.length ? '思考 · ' + segs.length + ' 段' : '思考';
      m.plain = false;
      m.chev.style.display = '';
      m.head.removeAttribute('data-plain');
    }
    // 不可展开时去掉「像能点」的反馈
    m.head.style.cursor = m.plain ? 'default' : 'pointer';
  }
  function finalizeRsn() {
    if (!state.rsn) return;
    updateRsnTitle();
    if (state.rsn.plain) state.rsn.body.style.display = 'none';
    state.rsn = null; state.rsnRaw = '';
  }

  /* ToolPlaceholder(:2199-2270)  Clock / CircleAlert + 13sp Bold + 状态胶囊 */

  /* ToolActivityCard(:1625-1748)
     折叠行 8dp 圆角 + activitySurface + chevron + 16dp 图标 + 13sp mono 摘要
     展开体 14dp 圆角 + subtle + 1dp 描边；Command 走 CommandLineBar，其余走 输入/输出 段落 */
  function toolIconId(name) {
    var n = String(name || '').toLowerCase();
    if (/bash|shell|zsh|command|exec|run|terminal|\bcmd\b/.test(n)) return 'i-terminal';
    if (/write|edit|read|file|glob|grep|patch|diff|apply|notebook/.test(n)) return 'i-filepen';
    if (/agent|task|subagent|delegate/.test(n)) return 'i-bot';
    return 'i-hammer';
  }
  function isCmdTool(name) {
    return /bash|shell|zsh|command|exec|run|terminal|\bcmd\b/i.test(String(name || ''));
  }
  function toolCard(name, opts) {
    opts = opts || {};
    var cmd = isCmdTool(name);
    var d = el('div', 'tool' + (cmd ? ' tool--cmd' : '') + (opts.failed ? ' tool--err' : ''));
    var head = el('button', 'tool__head');
    head.type = 'button';
    head.setAttribute('aria-expanded', 'false');
    head.appendChild(box('chev', 'i-chev', 16));
    head.appendChild(box('tool__ico', toolIconId(name), 16));
    var sum = el('span', 'tool__sum', String(opts.summary || name || '工具'));
    head.appendChild(sum);
    if (opts.pill) head.appendChild(el('span', 'pill' + (opts.failed ? ' pill--err' : ''), opts.pill));
    d.appendChild(head);
    var detail = el('div', 'tool__detail');
    detail.style.display = 'none';
    d.appendChild(detail);
    head.onclick = function () {
      var open = head.getAttribute('aria-expanded') !== 'true';
      head.setAttribute('aria-expanded', String(open));
      detail.style.display = open ? '' : 'none';
      if (open) { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }  // :1656 触感
    };
    pushItem(d);
    return { el: d, head: head, sum: sum, detail: detail, cmd: cmd };
  }
  /* CommandLineBar(:1969-2019)  14dp 圆角 · sessionCodeSurface · "$" + 13sp mono */
  function cmdBar(label, command) {
    var w = el('div', 'cmdbar');
    var h = el('div', 'cmdbar__head');
    h.appendChild(el('span', 'cmdbar__label', label || '命令'));
    h.appendChild(copyBtn(command));
    w.appendChild(h);
    var b = el('div', 'cmdbar__body');
    b.appendChild(el('span', 'cmdbar__p', '$'));
    b.appendChild(el('span', 'cmdbar__t', command));
    w.appendChild(b);
    return w;
  }
  /* CommandPreviewSection(:2021-2052)  11sp Bold 标签 + 12dp 圆角代码块（min 64dp） */
  function toolSection(label, text, isErr) {
    var s = el('div', 'sect');
    var h = el('div', 'sect__head');
    h.appendChild(el('span', 'sect__label', label));
    h.appendChild(copyBtn(text));
    s.appendChild(h);
    var c = el('div', 'sect__code');
    c.appendChild(el('pre', 'sect__pre' + (isErr ? ' sect__pre--err' : ''), String(text == null ? '' : text)));
    s.appendChild(c);
    return s;
  }
  function stopPrevTool() {
    if (state.lastTool) {
      state.lastTool.sum.classList.remove('shimmer');
      state.lastTool = null;
    }
  }
  function onToolUse(ev) {
    finalizeRsn();
    finalizeAgent(false);
    stopPrevTool();
    var name = ev.name || '工具';
    var input = String(ev.text == null ? '' : ev.text);
    var head = input.split('\n')[0].trim();
    var summary = head ? (name + ' · ' + head) : name;
    if (summary.length > 120) summary = summary.slice(0, 120) + '…';
    var card = toolCard(name, { summary: summary });
    if (input) {
      card.detail.appendChild(card.cmd ? cmdBar('命令', input) : toolSection('输入', input));
    }
    card.sum.classList.add('shimmer');   // :1704 运行中做扫光
    state.lastTool = card;
  }
  function onToolResult(ev) {
    var text = String(ev.text == null ? '' : ev.text);
    var card = state.lastTool;
    if (!card) card = toolCard('结果', { summary: '结果' });
    var err = /^\s*(error|错误|失败)/i.test(text) || /\bexit code [1-9]/.test(text);
    if (card.cmd && !card.detail.firstChild && !err) {
      // 命令卡还没展开过命令本体时，把结果当输出段
      card.detail.appendChild(cmdBar('命令', text));
    } else {
      card.detail.appendChild(toolSection('输出', text, err));
    }
    if (err) {
      card.el.classList.add('tool--err');
      card.head.appendChild(el('span', 'pill pill--err', 'failed'));
    }
    stopPrevTool();
  }

  /* ── 事件 → 界面（历史与实时共用同一条路径，靠 seq 去重） ── */
  function render(ev) {
    if (ev.seq != null && state.renderedSeq[ev.seq]) return;
    if (ev.seq != null) state.renderedSeq[ev.seq] = true;
    /* ⚠️ 两套字段名都要认：
       实时 SSE（magic-agent --stream --events）事件用 `type`；
       落盘的 <session_id>.jsonl 用 `kind`（internal/cli/sessionlog.go 的 sessionEvent.Kind）。
       只认 type 的后果是「从列表点进会话」历史整段空白 —— 静默失败，最难查。 */
    var t = ev.type || ev.kind;
    if (t === 'ready') {
      setWorking('Agent 运行中');
    } else if (t === 'thinking') {
      var m = ensureRsn();
      state.rsnRaw += ev.text || '';
      m.md.innerHTML = mdToHtml(state.rsnRaw);
      updateRsnTitle();
      if (state.autoFollow) scrollBottom();
    } else if (t === 'text') {
      finalizeRsn();
      ensureAgent();
      state.agentRaw += ev.text || '';
      scheduleMd();
    } else if (t === 'tool_use') {
      onToolUse(ev);
    } else if (t === 'tool_result') {
      onToolResult(ev);
    } else if (t === 'user') {
      // 历史里「用户自己那条」。core 目前只落引擎事件，这条是给落盘后预留的；
      // 认它不花成本，落盘一上线历史就自然有气泡。
      finalizeRsn(); finalizeAgent(true); stopPrevTool(); clearWorking();
      userBubble(String(ev.text || ''), false);
    } else if (t === 'turn_end') {
      if (ev.session_id) state.session = ev.session_id;
      clearWorking();
      finalizeRsn();
      // 兜底：个别引擎只在 turn_end 带整轮正文（正文增量一条都没到时用它）
      if (!state.cur && !state.agentRaw && ev.text) { ensureAgent(); state.agentRaw = ev.text; }
      finalizeAgent(true);
      stopPrevTool();
    } else if (t === 'result') {
      clearWorking();
      finalizeRsn();
      finalizeAgent(true);
      stopPrevTool();
      state.resultSeen = true;
      pushItem(sepItem('完成 · ' + (ev.latency_ms || 0) + 'ms'));
    } else if (t === 'error') {
      clearWorking();
      finalizeRsn();
      finalizeAgent(true);
      stopPrevTool();
      pushItem(phItem('本轮失败：' + (ev.reason || ev.error || ''), 'err', 'failed'), true);
    } else if (t === 'ask') {
      finalizeRsn(); finalizeAgent(true); stopPrevTool();
      noticeItem(ev.text || '需要你确认');
    } else if (t === 'interrupted' || t === 'stopped') {
      clearWorking();
      finalizeRsn();
      finalizeAgent(true);
      stopPrevTool();
      pushItem(phItem(t === 'interrupted' ? '已中断' : '已停止', 'ok', null));
    }
  }

  function clearThread() {
    thread().innerHTML = '';
    state.cur = null; state.agentRaw = '';
    state.rsn = null; state.rsnRaw = '';
    state.lastTool = null; state.working = null;
    state.autoFollow = true;
    copyBin.length = 0;
    if (mdTimer) { clearTimeout(mdTimer); mdTimer = 0; }
    nearBottom(); syncBottomBtn();
  }
  function syncBottomBtn() {
    $('btnBottom').classList.toggle('tobottom--on', !state.autoFollow && thread().scrollHeight > thread().clientHeight + 80);
  }

  /* ── 会话详情 ── */
  function openChat(s) {
    if (s) {
      state.session = sessionKey(s);
      state.engine = s.engine || state.engine;
      $('chatTitle').textContent = sessionTitle(s);
    } else {
      state.session = null;
      $('chatTitle').textContent = state.engine ? ('新会话 · ' + state.engine) : '新会话';
    }
    clearThread();
    show('chat');
    setTimeout(function () { $('input').focus(); }, 60);
    // 「看历史」：拉 ~/.magic-agent/sessions/<id>.jsonl 里的事件，渲染到 thread。
    // SSE 流（POST /desk/ask）只从这一刻起算新事件 —— 历史与实时共用 render()，
    // 事件 schema 一致；renderer 会跳过带 seq 的重复事件。
    if (state.session) {
      loadHistory(state.session).catch(function (e) {
        noticeItem('历史加载失败：' + (e.message || e));
      });
    }
  }

  // loadHistory：事件按 seq 顺序喂给 render。
  // 兜底：网络失败 / 401 / 解析失败都不打断进入详情 —— 历史只是增强，空 thread 也能用。
  function loadHistory(sid) {
    return api('/desk/session/' + encodeURIComponent(sid) + '/messages')
      .then(function (resp) {
        if (!resp.ok) throw new Error(String(resp.status));
        return resp.json();
      })
      .then(function (r) {
        var events = (r && r.events) || [];
        events.sort(function (a, b) { return Number(a.seq || 0) - Number(b.seq || 0); });
        events.forEach(function (ev) { try { render(ev); } catch (e) { /* 单条坏事件吞掉 */ } });
        var a = thread(); a.scrollTop = a.scrollHeight;
        return events.length;
      });
  }
  function show(which) {
    $('viewList').classList.toggle('view--on', which === 'list');
    $('viewChat').classList.toggle('view--on', which === 'chat');
  }

  async function send() {
    var text = $('input').value.trim();
    if (!text || state.busy) return;
    if (!state.engine) { noticeItem('没有可用引擎：先在「设备 → 引擎」里装一个'); return; }
    userBubble(text, false);
    $('input').value = ''; autoGrow();
    state.busy = true; setSendMode('busy');
    finalizeRsn(); finalizeAgent(true); stopPrevTool();
    setWorking('Agent 运行中');
    state.resultSeen = false;
    try {
      var body = { engine: state.engine, prompt: text };
      if (state.session) body.session = state.session;
      var resp = await api('/desk/ask', { json: body });
      if (!resp.ok) throw new Error(resp.status + ' ' + (await resp.text()));
      var reader = resp.body.getReader(), dec = new TextDecoder(), buf = '';
      for (;;) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += dec.decode(chunk.value, { stream: true });
        var blocks = buf.split('\n\n'); buf = blocks.pop();
        for (var i = 0; i < blocks.length; i++) {
          var name = '', data = '';
          blocks[i].split('\n').forEach(function (ln) {
            if (ln.indexOf('event: ') === 0) name = ln.slice(7).trim();
            else if (ln.indexOf('data: ') === 0) data += ln.slice(6);
          });
          if (!data) continue;
          var ev; try { ev = JSON.parse(data); } catch (e) { continue; }
          if (name === 'open') continue;
          if (name === 'end') {
            if (ev.code !== 0) noticeItem('core 退出码 ' + ev.code);
            continue;
          }
          try { render(ev); } catch (e) {}
        }
      }
    } catch (e) {
      noticeItem('发送失败：' + (e.message || e));
    } finally {
      clearWorking();
      finalizeRsn();
      finalizeAgent(true);
      stopPrevTool();
      if (!state.resultSeen) pushItem(sepItem('完成'));
      state.busy = false; setSendMode('idle');
      refresh();
    }
  }
  function setSendMode(mode) {
    var b = $('btnSend');
    b.disabled = mode === 'busy';
    b.classList.toggle('sendbtn--stop', mode === 'busy');
    b.innerHTML = '';
    b.appendChild(svgIcon(mode === 'busy' ? 'i-clock' : 'i-up', 17));
    b.setAttribute('aria-label', mode === 'busy' ? '中断' : '发送');
  }

  /* ── 底部面板 ── */

    $('sheetTitle').textContent = title;
    var body = $('sheetBody'); body.innerHTML = '';
    rows.forEach(function (r) { body.appendChild(r); });

    $('sheet').classList.add('sheet--on');

      sheetRow('复制会话 ID', shortName(id), function () { doCopy(id); })
    ]);

  function openEngineSheet() {
    if (!state.engines.length) {
      openSheet('选择引擎', [sheetRow('没有可用引擎', '先在设备页看看', function () {})]);
      return;
    }
    openSheet('选择引擎', state.engines.map(function (e) {
      return sheetRow(e.engine, e.ok ? '可用' : '未安装', function () {

      });

  function autoGrow() {
    var t = $('input');
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 92) + 'px';
  }

  /* ── 接线 ── */
  // markdown 里生成的复制按钮（代码面板）：事件委托，避免每次重绘都重新绑定
  $('thread').addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('[data-copy-idx]') : null;
    if (t) { doCopy(copyBin[Number(t.getAttribute('data-copy-idx'))]); return; }
  });
  $('thread').addEventListener('scroll', function () {
    state.autoFollow = nearBottom();
    syncBottomBtn();
  });
  $('btnBottom').onclick = function () {
    state.autoFollow = true;
    scrollBottom();
    syncBottomBtn();
  };
  $('input').addEventListener('input', autoGrow);
  $('composer').addEventListener('submit', function (e) { e.preventDefault(); send(); });
  $('input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
  });
  $('backdrop').onclick = closeSheet;
  $('btnBack').onclick = function () { show('list'); refresh(); };
  $('fabNew').onclick = function () { openChat(null); };
  $('btnEngines').onclick = openEngineSheet;
  $('btnPlus').onclick = openEngineSheet;
  $('btnTakeover').onclick = function () {

  };
  $('btnSearch').onclick = function () {
    var b = $('searchBox');
    var on = b.style.display === 'none';
    b.style.display = on ? 'block' : 'none';
    if (on) b.focus(); else { state.query = ''; b.value = ''; renderLists(); }
  };
  $('searchBox').addEventListener('input', function () { state.query = this.value.trim(); renderLists(); });
  $('qTerminal').onclick = function () { openSheet('终端', [sheetRow('还没有终端后端', '要接什么？', function () {})]); };
  $('qFiles').onclick = function () { openSheet('文件', [sheetRow('还没有文件后端', '要接什么？', function () {})]); };
  $('qDevices').onclick = function () { selectTab('devices'); };
  $('btnAccount').onclick = function () {
    openSheet('连接', [
      sheetRow('桌面地址', BASE.replace(/^https?:\/\//, ''), function () {}),
      sheetRow('契约版本', state.contract ? 'v' + state.contract.contractVersion : '—', function () {}),
      sheetRow('可用引擎', state.engines.filter(function (e) { return e.ok; }).length + ' / ' + state.engines.length, function () {})
    ]);

  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.onclick = function () { selectTab(b.getAttribute('data-tab')); };
  });
  function selectTab(tab) {
    state.tab = tab;
    document.querySelectorAll('#tabs button').forEach(function (b) {

  ['secPinned', 'secRecent'].forEach(function (id) {

    };

  async function refresh() {
    try {
      var out = await (await api('/desk/sessions')).json();
      state.sessions = Array.isArray(out) ? out : (out.sessions || []);
    } catch (e) { state.sessions = []; }
    renderLists();
  }

  (async function boot() {
    try {
      state.contract = await (await api('/desk/contract')).json();
      state.profile = await (await api('/desk/profile')).json();
      var eng = await (await api('/desk/engines')).json();
      state.engines = Array.isArray(eng) ? eng : [];
      var first = state.engines.filter(function (e) { return e.ok; })[0];
      if (first) state.engine = first.engine;
      if (state.profile && state.profile.app && state.profile.app.name) {
        $('wordmark').textContent = state.profile.app.name;
        document.title = state.profile.app.name;
      }
      try {
        var mods = await (await api('/desk/modules')).json();
        state.modules = (mods && mods.modules) || [];
      } catch (e) { state.modules = []; }
      await refresh();
      selectTab('active');
    } catch (e) {
      var li = el('li');
      li.appendChild(el('div', 'empty', '连不上桌面端：' + (e.message || e) + '（地址要带 ?token=）'));
      $('listRecent').appendChild(li);
    }
  })();
})();
</script>
