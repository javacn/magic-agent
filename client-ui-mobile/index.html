<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>掌天瓶 · 对话</title>
<!--
  移动端宿主：把**同一个**公共对话组件（shared/conversation.js）挂到页面上。
  与 PC 那份是同一份实现 —— 差别只有两个：这个文件里的颜色令牌用的是
  agents-anywhere 安卓端（Jetpack Compose）那套十六进制值，以及多了一条
  移动端形态的顶栏。

  ── 顶栏为什么还在宿主里 ──
    组件只负责对话区（消息流 + 输入框 + 三项选择器）。标题栏、返回、主题这些
    属于宿主形态，PC 与移动端的形态本来就不一样，塞进组件反而会让两边互相牵制。

  ── 视觉基准（逐值抄自 AA 安卓端的 Compose 源码，不是目测）──
    designsystem/Theme.kt        → 全部色令牌（暗色 canvas #09090B / 亮色 #FDFCFB 等）
    SessionDetailScreen.kt       → 顶栏 BackIconButton / TitlePill 的尺寸
    对话区本身（气泡 / markdown / 工具卡 / 思考块 / 审批卡）在共享组件里，
    那里同样标了对应的 Compose 行号。

  ── 公共组件在哪 ──
    对话区在 ../client-ui/shared/ 下（PC 与移动端同一份实现）。这一页**按同级
    路径 shared/ 引用**：打包时由 magic-test 的 tools/build-mobile-www.cjs 把
    client-ui/shared 一起复制进 www/shared —— 所以产物里是这个相对关系。
    直接拿浏览器开这个文件时，请让静态服务器同时暴露 client-ui-mobile/ 与
    client-ui/shared（或在临时目录里拼出同样的同级关系），否则共享模块会 404。
-->
<link rel="stylesheet" href="shared/conversation.css">
<style>
/* ===== 令牌：AA 安卓端那一套，映射到共享组件的颜色契约 =====
   ⚠️ 默认 = 暗色：跟 anywhere 的 DarkAgentsAnywhereColors 逐字段对齐。
   用户在系统里选了亮色才切亮色（没设主题时不会莫名跑出白底）。 */
:root{
  color-scheme:dark;
  --canvas:#09090B;
  --ink:#FAFAFA; --ink-soft:#E5E5E5; --muted:#A3A3A3; --faint:#737373;
  --border:rgba(255,255,255,.09); --subtle:#292929; --raised:#1F1F1F;
  --primary-action:#FAFAFA; --on-primary-action:#09090B;
  --app-shadow:rgba(0,0,0,.32);

  --bubble:#2A2A2A; --bubble-text:#F4F4F5;
  --code:#111113; --status-neutral:#2D2D2D; --status-neutral-text:#D4D4D8;
  --activity:rgba(24,24,27,.063);

  --md-body:#EDEDEF; --md-muted:#A1A1AA; --md-border:#27272A; --md-code-bg:#292929;
  --link:#EBB353; --prompt:#E8798F; --shimmer:#FFFFFF;
  --panel:#1F1F1F; --panel-border:#27272A;

  --accent:#39A887; --warning:#F59E0B; --success:#22C55E;
  --error-surface:#2A1214; --error-border:#5F2429; --error-text:#FCA5A5; --error-icon:#F97066;
  --running:#10B981; --transitioning:#3B82F6; --active:#F59E0B;

  /* 移动端沿用 AA 的三档圆角（18 / 12 / full），与 Compose 规格一致 */
  --r-card:18px; --r:12px; --r-full:999px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"SF Mono",monospace;
}
@media (prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --canvas:#FDFCFB;
    --ink:#0A0A0B; --ink-soft:#2B2B2B; --muted:#777777; --faint:#AAA8A2;
    --border:#E7E5E0; --subtle:#F1F0ED; --raised:#FFFFFF;
    --primary-action:#0A0A0B; --on-primary-action:#FFFFFF;
    --app-shadow:rgba(0,0,0,.13);
    --bubble:#F1F0ED; --bubble-text:#242522;
    --code:rgba(255,255,255,.72); --status-neutral:#E4E2DD; --status-neutral-text:#6F6E69;
    --activity:rgba(241,240,237,.08);
    --md-body:#242522; --md-muted:#7C7B76; --md-border:#E4E1DB; --md-code-bg:#F1F0ED;
    --link:#EBB353; --prompt:#C45D74; --shimmer:#000000;
    --panel:#ECECEA; --panel-border:transparent;
    --accent:#18866A; --warning:#D97706; --success:#16A34A;
    --error-surface:#FFF4F4; --error-border:#F4C7C7; --error-text:#B42318; --error-icon:#B42318;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ⚠️ 锁死视口高度而不是 min-height：用 min-height 时 body 会被内容撑高，
   滚动条落到 document 上，.conv__thread 的 overflow-y:auto 就永远不触发 ——
   后果是打开会话看不到顶部，也做不了「回到底部」。 */
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--canvas);color:var(--ink);font:15px/1.45 var(--font);
     overscroll-behavior:none;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}

/* ── 顶栏 SessionDetailScreen：BackIconButton 40dp 圆 · TitlePill 34dp 胶囊 ── */
.detailbar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;flex:0 0 auto}
.iconbtn{width:40px;height:40px;border-radius:var(--r-full);display:flex;align-items:center;
  justify-content:center;background:var(--raised);color:var(--ink);border:1px solid var(--border)}
.titlepill{justify-self:center;max-width:100%;height:34px;display:flex;align-items:center;
  padding:0 14px;border:1px solid var(--border);border-radius:var(--r-full);background:var(--raised);
  font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 组件挂载点：占满剩余高度 */
#conv{flex:1;min-height:0;display:flex}

/* 挂载失败时说明原因，而不是留一片空白 */
.boot-err{margin:16px;padding:14px;border-radius:14px;background:var(--error-surface);
  border:1.2px solid var(--error-border);color:var(--error-text);font-size:13.5px;line-height:1.55}

/* 底部安全区：iPhone 的 home indicator 会压住输入框 */
.composer{padding-bottom:calc(16px + env(safe-area-inset-bottom))}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></symbol>
</svg>

<div class="detailbar">
  <button class="iconbtn" id="btnNew" aria-label="新会话"><svg width="20" height="20"><use href="#i-plus"/></svg></button>
  <span class="titlepill" id="title">新会话</span>
  <span></span>
</div>
<div id="conv"></div>

<script src="shared/conversation.js"></script>
<script src="shared/transport-http.js"></script>
<script>
(function () {
  'use strict';

  /* 基址与令牌：两种宿主。
     · 打包进 App（Capacitor）：页面是本地文件，地址与令牌由 boot.js 从配对信息注入 ——
       那时 window.MAGIC_BASE 非空，所有 /desk/* 请求要前缀到桌面地址上；
     · 浏览器同源打开（调试）：不带 MAGIC_BASE，token 在 ?token= 上。 */
  var TOKEN = window.MAGIC_TOKEN || new URLSearchParams(location.search).get('token') || '';
  var BASE = (window.MAGIC_BASE || '').replace(/\/+$/, '');

  var titleEl = document.getElementById('title');

  function showBootError(msg) {
    var d = document.createElement('div');
    d.className = 'boot-err';
    d.textContent = msg;
    document.getElementById('conv').appendChild(d);
  }

  /* 打包进 App 时页面在本地（capacitor://localhost 或 file://），
     不能直接 fetch 本地相对路径 —— 下面这层把 <img src> 之类的相对资源
     前缀成桌面地址。与 boot.js 的垫片同一思路，只是这里组件不产生 img，
     所以只需要保证 fetch 走 BASE（组件已按 opts.base 处理）。 */

  var conv = null;
  (async function boot() {
    try {
      /* 传输层由宿主注入 —— 组件本身不连后端。
         打包进 App 时这里会换成「走自己后端」的实现；当前先用 HTTP 参考件。 */
      var transport = window.MagicTransportHttp({ base: BASE, token: TOKEN });
      conv = window.MagicConversation.create({
        el: document.getElementById('conv'),
        transport: transport,
        titleEl: titleEl,
      });
      document.getElementById('btnNew').onclick = function () { conv.newSession(); };
      /* 供对接方/调试取用：window.magicConv.setSession(sid) 换会话 */
      window.magicConv = conv;
    } catch (e) {
      showBootError('对话组件挂载失败：' + (e && e.message ? e.message : e));
    }
  })();
})();
</script>
</body>
</html>
